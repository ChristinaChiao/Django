<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>房價預測系統</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h2>Linear Regression 房價預測系統</h2>
                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <!-- 坪數 -->
                        <div class="mb-3">
                            <label class="form-label">坪數</label>

                            <input type="number"
                                   name="area"
                                   class="form-control"
                                   step="0.1"
                                   value="35"
                                   required>
                        </div>

                        <!-- 屋齡 -->
                        <div class="mb-3">
                            <label class="form-label">屋齡</label>

                            <input type="number"
                                   name="house_age"
                                   class="form-control"
                                   step="0.1"
                                   value="8"
                                   required>
                        </div>

                        <!-- 房間數 -->
                        <div class="mb-3">
                            <label class="form-label">房間數</label>

                            <input type="number"
                                   name="rooms"
                                   class="form-control"
                                   value="3"
                                   min="1"
                                   required>
                        </div>

                        <!-- 樓層 -->
                        <div class="mb-3">
                            <label class="form-label">樓層</label>

                            <input type="number"
                                   name="floor"
                                   class="form-control"
                                   value="12"
                                   min="1"
                                   required>
                        </div>

                        <!-- 捷運距離 -->
                        <div class="mb-3">
                            <label class="form-label">
                                捷運距離（公尺）
                            </label>

                            <input type="number"
                                   name="mrt_distance"
                                   class="form-control"
                                   value="400"
                                   min="0"
                                   required>
                        </div>

                        <!-- 學校距離 -->
                        <div class="mb-3">
                            <label class="form-label">
                                學校距離（公尺）
                            </label>

                            <input type="number"
                                   name="school_distance"
                                   class="form-control"
                                   value="600"
                                   min="0"
                                   required>
                        </div>

                        <!-- 有無車位 -->
                        <div class="mb-3">
                            <label class="form-label">是否有車位</label>

                            <select name="parking"
                                    class="form-select"
                                    required>

                                <option value="1" selected>
                                    有車位
                                </option>

                                <option value="0">
                                    無車位
                                </option>

                            </select>
                        </div>

                        <!-- 行政區 -->
                        <div class="mb-3">
                            <label class="form-label">行政區</label>

                            <select name="district"
                                    class="form-select"
                                    required>

                                <option value="">
                                    請選擇行政區
                                </option>

                                <option value="行政區_台北市信義區">
                                    台北市信義區
                                </option>

                                <option value="行政區_台北市大安區">
                                    台北市大安區
                                </option>

                                <option value="行政區_台南市東區">
                                    台南市東區
                                </option>

                                <option value="行政區_新北市新店區">
                                    新北市新店區
                                </option>

                                <option value="行政區_新北市板橋區">
                                    新北市板橋區
                                </option>

                                <option value="行政區_桃園市中壢區"
                                        selected>
                                    桃園市中壢區
                                </option>

                                <option value="行政區_高雄市左營區">
                                    高雄市左營區
                                </option>

                            </select>
                        </div>

                        <!-- 預測按鈕 -->
                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary btn-lg">

                                預測房價

                            </button>
                        </div>

                    </form>

                    <!-- 顯示預測結果 -->
                    {% if prediction != None %}

                        <div class="alert alert-success mt-4 text-center">

                            <h4>預測結果</h4>

                            <h2>
                                預測房價：
                                {{ prediction }}
                                萬元
                            </h2>

                        </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
