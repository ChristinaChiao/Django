<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View History Temperature</title>
  <style>
    h1 {text-align: center;}
    table {
      width: 50%; margin: auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>歷史溫濕度顯示</h1>
  <table>
    <tr>
      <th>id</th>
      <th>sensor_id</th>
      <th>溫度</th>
      <th>濕度</th>
      <th>時間</th>
    </tr>
    {% for data in datas %}
    <tr>
      <th>{{ data.myid }}</th>
      <th>{{ data.sensor_id }}</th>
      <th>{{ data.temperature }}</th>
      <th>{{ data.humidity }}</th>
      <th>{{ data.timestamp }}</th>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
