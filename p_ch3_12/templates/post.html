{% extends "base.html" %}
{% block title %}
<title>學生資料管理系統-新增資料</title>
  <style>
    h1, h2, h3 {
      text-align: center;
    }
    table {
      margin: 0 auto;
    }
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    .head_content {
      
      margin-bottom: 40px;
    }
  </style>
{% endblock  %}
{% block content %}
<div>
    <h1>學生資料管理系統-新增資料</h1>
    <!-- <h3><a href="/index/">回首頁</a></h3> -->
    <h3><a href="{% url 'index' %}">回首頁</a></h3>
</div>
<div>
    <form action="{% url 'post' %}" method="post">
      {%  csrf_token %}
        <table>
            <tr>
                <th>姓名</th>
                <td><input type="text" id="cname" name="cname" placeholder="請輸入姓名" required></td>
            </tr>
            <tr>
                <th>性別</th>
                <td>
                    <input type="radio" id="male" name="csex" value="M" required>
                    <label for="male">男</label>
                    <input type="radio" id="female" name="csex" value="F" required>
                    <label for="female">女</label>
                </td>
            </tr>
            <tr>
                <th>生日</th>
                <td><input type="date" id="cbirthday" name="cbirthday" required></td>
            </tr>
            <tr>
                <th>信箱</th>
                <td><input type="email" id="cemail" name="cemail" placeholder="請輸入信箱" required></td>
            </tr>
            <tr>
                <th>電話</th>
                <td><input type="text" id="cphone" name="cphone" placeholder="請輸入電話" required></td>
            </tr>
            <tr>
                <th>地址</th>
                <td><input type="text" id="caddr" name="caddr" placeholder="請輸入地址" required></td>
            </tr>
            <tr>
                <th>
                    <input type="submit" name="submit" id="submit" value="儲存">
                    <input type="reset" name="reset" id="reset" value="清除">
                </th>
            </tr>

        </table>
    </form>
</div>
{% endblock  %}
