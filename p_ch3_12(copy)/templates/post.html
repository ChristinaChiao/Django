{% extends "base.html" %}
{% block title %}<title>新增學生資料</title>{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-elevated p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title mb-0"><i class="bi bi-person-plus-fill me-2"></i>新增學生資料</h2>
        <a href="{% url 'index' %}" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-arrow-left"></i> 回首頁
        </a>
      </div>

      <form action="{% url 'post' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="cname" class="form-label">姓名</label>
          <input type="text" class="form-control" id="cname" name="cname" placeholder="請輸入姓名" required>
        </div>

        <div class="mb-3">
          <label class="form-label d-block">性別</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="male" name="csex" value="M" required>
            <label class="form-check-label" for="male">男</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="female" name="csex" value="F" required>
            <label class="form-check-label" for="female">女</label>
          </div>
        </div>

        <div class="mb-3">
          <label for="cbirthday" class="form-label">生日</label>
          <input type="date" class="form-control" id="cbirthday" name="cbirthday" required>
        </div>

        <div class="mb-3">
          <label for="cemail" class="form-label">信箱</label>
          <input type="email" class="form-control" id="cemail" name="cemail" placeholder="請輸入信箱" required>
        </div>

        <div class="mb-3">
          <label for="cphone" class="form-label">電話</label>
          <input type="text" class="form-control" id="cphone" name="cphone" placeholder="請輸入電話" required>
        </div>

        <div class="mb-4">
          <label for="caddr" class="form-label">地址</label>
          <input type="text" class="form-control" id="caddr" name="caddr" placeholder="請輸入地址" required>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="reset" class="btn btn-outline-secondary">
            <i class="bi bi-eraser"></i> 清除
          </button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> 儲存
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
