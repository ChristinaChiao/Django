{% extends "base.html" %}
{% block title %}<title>姓名查詢</title>{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card card-elevated p-4">
      <h2 class="section-title mb-4"><i class="bi bi-search me-2"></i>姓名查詢</h2>
      <form action="/search_list/" method="get">
        <div class="mb-3">
          <label for="cname" class="form-label">姓名關鍵字</label>
          <input type="text" class="form-control" id="cname" name="cname" placeholder="請輸入姓名">
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-search"></i> 搜尋
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
