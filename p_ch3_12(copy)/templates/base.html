<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% block title %}<title>學生資料管理系統</title>{% endblock %}

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --brand-primary: #1e6feb;
      --brand-primary-dark: #144fb0;
      --brand-soft: #eaf2ff;
      --brand-border: #d5e3fb;
      --brand-text: #0b2545;
    }
    body {
      background: linear-gradient(180deg, #f5f9ff 0%, #eaf2ff 100%);
      min-height: 100vh;
      color: var(--brand-text);
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    }
    .navbar-brand-blue { background-color: var(--brand-primary) !important; }
    .navbar-brand-blue .navbar-brand,
    .navbar-brand-blue .nav-link { color: #fff !important; }
    .navbar-brand-blue .nav-link:hover { color: #cfe0ff !important; }
    .card-elevated {
      border: 1px solid var(--brand-border);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(30, 111, 235, 0.08);
      background-color: #fff;
    }
    .section-title {
      color: var(--brand-primary-dark);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background-color: var(--brand-primary);
      border-color: var(--brand-primary);
    }
    .btn-primary:hover,
    .btn-primary:focus {
      background-color: var(--brand-primary-dark);
      border-color: var(--brand-primary-dark);
    }
    .btn-outline-primary {
      color: var(--brand-primary);
      border-color: var(--brand-primary);
    }
    .btn-outline-primary:hover {
      background-color: var(--brand-primary);
      border-color: var(--brand-primary);
      color: #fff;
    }
    .table thead th {
      background-color: var(--brand-soft);
      color: var(--brand-primary-dark);
      border-bottom: 2px solid var(--brand-border);
      font-weight: 600;
      white-space: nowrap;
    }
    .table tbody tr:hover { background-color: #f4f8ff; }
    .form-label {
      color: var(--brand-primary-dark);
      font-weight: 500;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 0.2rem rgba(30, 111, 235, 0.15);
    }
    .page-item.active .page-link {
      background-color: var(--brand-primary);
      border-color: var(--brand-primary);
    }
    .page-link { color: var(--brand-primary); }
    footer.app-footer { color: #6b7a99; font-size: 0.9rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-brand-blue shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'index' %}">
      <i class="bi bi-mortarboard-fill me-1"></i> 學生資料管理系統
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}"><i class="bi bi-house-door"></i> 首頁</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'post' %}"><i class="bi bi-plus-circle"></i> 新增</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'search_name' %}"><i class="bi bi-search"></i> 姓名查詢</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<footer class="app-footer text-center py-4">
  <div class="container">
    <hr class="mb-3">
    <small>&copy; 學生資料管理系統 · Powered by Django &amp; Bootstrap</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
